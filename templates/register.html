<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Hostel Room Allocation System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body>
  <div class="register-card">
    <div class="icon-container">
      <img src="{{ url_for('static', filename='images/hostel-icon.svg') }}" alt="Hostel Icon">
    </div>
    <h1>Student Registration</h1>
    <p class="subtitle">Create your account to request hostel rooms</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="message {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form id="register-form" method="POST" action="{{ url_for('auth.register') }}" novalidate>
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email address">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password">
      </div>

      <div class="form-group">
        <label for="student_id">Student ID</label>
        <input type="text" id="student_id" name="student_id" placeholder="Enter your student ID">
      </div>

      <button type="submit" class="btn-register">Register</button>
    </form>

    <div class="login-link-container">
      Already have an account? <a id="login-link" href="{{ url_for('auth.login') }}">Login here</a>
    </div>
  </div>
</body>
</html>
